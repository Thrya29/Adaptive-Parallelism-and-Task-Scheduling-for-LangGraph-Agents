[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "adaptive-scheduler"
version = "0.1.0"
description = "Adaptive parallelism and cost-aware DAG task scheduling for LangGraph agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thrya29" }]
keywords = ["langgraph", "llm-agents", "scheduling", "dag", "critical-path", "parallelism"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "langgraph>=1.2,<2",
    "langchain-core>=1.6,<2",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "numpy>=2.0,<3",
]

[project.optional-dependencies]
# Real LLM backend. Without it (or without an API key) the deterministic mock LLM is used.
anthropic = ["langchain-anthropic>=1.7,<2"]
api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sse-starlette>=2.1,<4",
]
observability = [
    "opentelemetry-sdk>=1.30,<2",
    "prometheus-client>=0.21,<1",
]
experiments = [
    "matplotlib>=3.9,<4",
    "scipy>=1.14,<2",
]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=6,<8",
    "httpx>=0.27,<1",
    "hypothesis>=6.100,<7",
    "ruff>=0.8,<1",
    "mypy>=1.13,<3",
    "pre-commit>=4,<5",
]
# Rebuild the docs media (screenshots, GIF, videos): python scripts/make_media.py
media = [
    "imageio-ffmpeg>=0.5,<1",
    "httpx>=0.27,<1",
    "pygments>=2.17,<3",
    "pillow>=10,<14",
]
all = ["adaptive-scheduler[anthropic,api,observability,experiments]"]

[project.scripts]
apsched = "adaptive_scheduler.cli:main"

[project.urls]
Repository = "https://github.com/Thrya29/Adaptive-Parallelism-and-Task-Scheduling-for-LangGraph-Agents"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_scheduler"]

# ---------------------------------------------------------------- tooling
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "PL", "PT", "ASYNC", "S", "C4", "RET"]
ignore = [
    "PLR0913",  # many-argument constructors are fine for config-like objects
    "PLR2004",  # magic values are acceptable in algorithmic code with named context
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S311"]
# Media tooling deliberately shells out to a headless browser and ffmpeg.
"scripts/**" = ["S603", "S607", "E501", "PLR0913", "PLR0917", "PLC0415", "E402", "S101", "RUF001"]
# Markdown table templates: splitting each row across lines would hurt readability.
"src/adaptive_scheduler/bench/live_report.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["adaptive_scheduler"]

[[tool.mypy.overrides]]
module = ["scipy.*", "opentelemetry.exporter.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "live: requires a real LLM API key (skipped automatically when absent)",
]

[tool.coverage.run]
source = ["adaptive_scheduler"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
